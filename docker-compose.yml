services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: rails_devise_project_production
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@root.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - postgres

  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
